[package]
name = "viz_l3"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.32", default-features = false, features = ["glow"] }
egui = { version = "0.32", features = ["default"] }
egui_extras = { version = "0.32", features = ["all_loaders"] }
egui_plot = "0.33.0"
rust_decimal = { version = "1.37.2", features = ["macros"] }
once_cell = "1.21.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
